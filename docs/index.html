<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>돈돈 가계부 지원</title>
<style>
  :root {
    color-scheme: light;
    --bg: #FAF6EE;
    --card: #FFFFFF;
    --text: #2A2220;
    --sub: #6B6058;
    --border: #E7DFD3;
    --accent: #7C6AEF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 40px 0;
    text-align: center;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--sub);
    font-size: 14px;
    margin: 0 0 28px;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
  }
  nav a {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
  }
  nav a span {
    display: block;
    margin-top: 2px;
    font-weight: 400;
    font-size: 12px;
    color: var(--sub);
  }
  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--sub);
  }
  footer a {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>돈돈 가계부</h1>
  <p class="subtitle">내 돈부터 우리집 돈까지, 더 쉽게 관리해요</p>

  <nav>
    <a href="./privacy.html">
      개인정보처리방침
      <span>어떤 정보를 어떻게 처리하는지 안내해요</span>
    </a>
    <a href="./delete-account.html">
      계정 삭제 안내
      <span>앱 내 삭제 방법과 이메일 요청 방법</span>
    </a>
    <a href="mailto:dondonledger@gmail.com">
      고객지원
      <span>dondonledger@gmail.com</span>
    </a>
  </nav>

  <footer>
    문의: <a href="mailto:dondonledger@gmail.com">dondonledger@gmail.com</a>
  </footer>
</main>
</body>
</html>
